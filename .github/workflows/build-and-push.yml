name: Build and push container image

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: set-tags
        shell: bash
        run: |
          set -euo pipefail
          BASE="ghcr.io/mimiteto/llama-cpp-observability"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            {
              echo 'tags<<EOF'
              echo "$BASE:$GITHUB_REF_NAME"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo 'tags<<EOF'
              echo "$BASE:latest"
              echo "$BASE:${GITHUB_SHA::7}"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.set-tags.outputs.tags }}
