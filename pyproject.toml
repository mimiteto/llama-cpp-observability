[project]
name = "llama-cpp-observability"
version = "0.1.0"
description = "llama.cpp observability helper"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "httpx",
    "uvicorn",
]

[project.scripts]
app = "llama_cpp_observability.app:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"
